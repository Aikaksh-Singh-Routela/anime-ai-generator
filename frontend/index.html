<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime AI Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            margin-top: 10px;
        }

        .generator-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #4ecdc4;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #4ecdc4;
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-area {
            margin-top: 30px;
            text-align: center;
        }

        .image-container {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .generated-image {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .placeholder {
            color: #666;
            text-align: center;
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #4ecdc4;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .prompt-display {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #888;
            max-width: 100%;
            word-wrap: break-word;
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .status.success {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
        }

        .status.error {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .download-btn {
            margin-top: 10px;
            padding: 8px 20px;
            width: auto;
            background: rgba(78, 205, 196, 0.3);
            border: 1px solid #4ecdc4;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .settings { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Anime AI Image Generator</h1>
            <p class="subtitle">Create stunning anime-style artwork with AI</p>
        </header>

        <div class="generator-card">
            <div class="input-group">
                <label>✨ Describe your anime scene</label>
                <textarea id="prompt" rows="3" placeholder="Example: cyberpunk samurai in neon-lit Tokyo street, anime style, detailed, vibrant colors"></textarea>
            </div>

            <div class="settings">
                <div>
                    <label>📏 Width</label>
                    <select id="width">
                        <option value="512">512x512</option>
                        <option value="768">768x768</option>
                        <option value="1024" selected>1024x1024 (HD)</option>
                    </select>
                </div>
                <div>
                    <label>📏 Height</label>
                    <select id="height">
                        <option value="512">512x512</option>
                        <option value="768">768x768</option>
                        <option value="1024" selected>1024x1024 (HD)</option>
                    </select>
                </div>
            </div>

            <button id="generateBtn" onclick="generateImage()">🚀 Generate Anime Art</button>

            <div class="result-area">
                <div class="image-container" id="imageContainer">
                    <div class="placeholder">✨ Your anime artwork will appear here ✨</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Powered by AI • Free & Open Source • Anime Style Optimized</p>
            <p>💡 Tip: Be specific in your prompt for better results!</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        async function generateImage() {
            const prompt = document.getElementById('prompt').value;
            const width = document.getElementById('width').value;
            const height = document.getElementById('height').value;
            const generateBtn = document.getElementById('generateBtn');
            const imageContainer = document.getElementById('imageContainer');

            if (!prompt.trim()) {
                alert('Please describe what you want to generate!');
                return;
            }

            // Show loading state
            generateBtn.disabled = true;
            generateBtn.textContent = '🎨 Generating... (15-30 seconds)';
            imageContainer.innerHTML = '<div class="loader"></div><div class="placeholder">AI is creating your anime art...<br>⏳ This may take 20-30 seconds</div>';

            try {
                const response = await fetch(`${API_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        width: parseInt(width),
                        height: parseInt(height)
                    })
                });

                const data = await response.json();

                if (data.success && data.image) {
                    // Store current image for download
                    window.currentImageData = data.image;
                    window.currentPrompt = prompt;
                    
                    // Display the generated image
                    imageContainer.innerHTML = `
                        <img src="data:image/png;base64,${data.image}" alt="Generated anime art" class="generated-image">
                        <div class="prompt-display">🎨 Prompt: ${prompt}</div>
                        <button class="download-btn" onclick="downloadImage()">💾 Download Image</button>
                    `;
                    showStatus('success', '✅ Image generated successfully!');
                } else {
                    throw new Error(data.error || 'Generation failed');
                }
            } catch (error) {
                console.error('Error:', error);
                imageContainer.innerHTML = '<div class="placeholder">❌ Failed to generate image. Please try again.<br><br>💡 Tips:<br>• Try a simpler prompt<br>• Check if backend is running<br>• Make sure port 5000 is available</div>';
                showStatus('error', '❌ Error: ' + error.message);
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = '🚀 Generate Anime Art';
            }
        }

        function downloadImage() {
            if (window.currentImageData) {
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                link.download = `anime-art-${timestamp}.png`;
                link.href = `data:image/png;base64,${window.currentImageData}`;
                link.click();
            }
        }

        function showStatus(type, message) {
            const existingStatus = document.querySelector('.status');
            if (existingStatus) existingStatus.remove();

            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            document.querySelector('.result-area').insertBefore(statusDiv, document.getElementById('imageContainer'));
            
            setTimeout(() => {
                if (statusDiv) statusDiv.remove();
            }, 5000);
        }

        // Allow Ctrl+Enter to trigger generation
        document.getElementById('prompt').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                generateImage();
            }
        });

        // Example prompts for inspiration
        const examplePrompts = [
            "cyberpunk samurai, neon lights, anime style",
            "magical girl casting spell, starry night background",
            "mecha robot fighting giant monster, city destruction",
            "peaceful cherry blossom garden, Japanese temple, sunset",
            "fantasy elf archer in enchanted forest",
            "dark souls inspired knight, abandoned castle, moonlight",
            "slice of life: girl reading book in cozy café",
            "dragon flying over medieval village, cinematic lighting"
        ];
        
        // Add example prompts as placeholder cycling (optional)
        let exampleIndex = 0;
        const textarea = document.getElementById('prompt');
        setInterval(() => {
            if (!textarea.value.trim()) {
                textarea.placeholder = `Example: ${examplePrompts[exampleIndex]}`;
                exampleIndex = (exampleIndex + 1) % examplePrompts.length;
            }
        }, 4000);
    </script>
</body>
</html>
